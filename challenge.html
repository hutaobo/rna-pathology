<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/site.css" />
  <script defer src="/assets/site.js"></script>
  <title>Cell Type Challenge | RNA Pathology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Member-only Guard (Supabase session) -->
  <script type="module">
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const next = encodeURIComponent(window.location.pathname || "/challenge.html");

    function showBlocker(msg) {
      const el = document.createElement("div");
      el.style.cssText = `
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: rgba(248,250,252,0.92);
        color: #111827; padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      `;
      el.innerHTML = `
        <div style="
          max-width: 680px; width: 100%;
          background: #ffffff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          padding: 18px 18px;
          box-shadow: 0 10px 26px rgba(2,6,23,0.12);
        ">
          <div style="font-weight: 800; margin-bottom: 8px;">Member access required</div>
          <div style="color:#374151; white-space: pre-wrap; font-size: 14px;">${msg}</div>
          <div style="margin-top: 14px;">
            <a href="/login.html?next=${next}" style="
              display:inline-block;
              background:#0b3c5d; color:#fff;
              text-decoration:none;
              font-weight:800;
              padding:10px 12px;
              border-radius:8px;
            ">Go to Sign In</a>
          </div>
        </div>
      `;
      document.body.appendChild(el);
    }

    try {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) throw error;

      if (!session) {
        window.location.href = "/login.html?next=" + next;
      } else {
        // Expose session email for header badge (optional UI)
        window.__memberEmail = session.user?.email || "";
        window.__supabaseClient = supabase;
      }
    } catch (e) {
      // If auth check itself fails, block page and provide action
      showBlocker(
        "We couldn’t verify your member session.\n\n" +
        "Reason: " + (e?.message || String(e)) + "\n\n" +
        "Please sign in again."
      );
    }
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #fafafa;
      color: #222;
    }

    header {
      background: #0b3c5d;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-left{
      display:flex;
      flex-direction: column;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cce4f6;
      text-decoration: none;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    /* ✅ Member badge */
    .member-box{
      display:flex;
      align-items:center;
      gap:10px;
      font-size: 13px;
      color: #e6f4ff;
      white-space: nowrap;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .dot{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52,211,153,0.18);
    }

    .signout-btn{
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #ffffff;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .signout-btn:hover{
      background: rgba(255,255,255,0.16);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .question-meta {
      background: #eef3f7;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .challenge-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .image-panel {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .image-panel img {
      max-width: 100%;
      border: 1px solid #ccc;
    }

    .control-panel {
      background: white;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .control-panel h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    select, button.action-btn {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      font-size: 14px;
    }

    button.action-btn {
      margin-top: 16px;
      background: #0b3c5d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button.action-btn:hover {
      background: #094062;
    }

    .feedback {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .feedback.correct {
      background: #e6f4ea;
      color: #1e7f3d;
    }

    .feedback.wrong {
      background: #fdecea;
      color: #b42318;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    @media (max-width: 900px){
      .challenge-container{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <a href="index.html" class="back-home">← Home</a>
    <h1>🧬 Cell Type Challenge</h1>
  </div>

  <!-- ✅ Member UI (populated after auth guard) -->
  <div class="member-box" id="memberBox" style="display:none;">
    <span class="pill" title="Signed-in member">
      <span class="dot"></span>
      <span id="memberEmail">Member</span>
    </span>
    <button class="signout-btn" id="signOutBtn" type="button">Sign out</button>
  </div>
</header>

<main>

  <!-- 题目信息 -->
  <div class="question-meta">
    <strong>Tissue:</strong> TNBC &nbsp;|&nbsp;
    <strong>Technology:</strong> Xenium &nbsp;|&nbsp;
    <strong>Difficulty:</strong> Medium
  </div>

  <div class="challenge-container">

    <!-- 图像区 -->
    <div class="image-panel">
      <p><strong>Xenium Cell Segmentation</strong></p>
      <img src="questions/xenium_demo_001.png" alt="Xenium segmentation">
      <p style="font-size:12px;color:#666;">
        Cells are pre-numbered. Select a cell ID to answer.
      </p>
    </div>

    <!-- 操作区 -->
    <div class="control-panel">
      <h3>Answer Panel</h3>

      <label for="cell-id">Cell ID</label>
      <select id="cell-id">
        <option value="">Select a cell</option>
        <option value="1">Cell 1</option>
        <option value="2">Cell 2</option>
        <option value="3">Cell 3</option>
        <option value="4">Cell 4</option>
      </select>

      <label for="cell-type">Predicted Cell Type</label>
      <select id="cell-type">
        <option value="">Select cell type</option>
        <option value="Tumor">Tumor</option>
        <option value="CAF">CAF</option>
        <option value="T cell">T cell</option>
        <option value="B cell">B cell</option>
        <option value="Endothelial">Endothelial</option>
        <option value="Myeloid">Myeloid</option>
      </select>

      <button class="action-btn" onclick="submitAnswer()">Submit Answer</button>

      <div id="feedback" class="feedback"></div>
    </div>

  </div>

  <footer>
    RNA Pathology · Spatial Omics Literacy Initiative
  </footer>

</main>

<script>
  // 临时答案（之后一定放到后端）
  const groundTruth = {
    "1": "Tumor",
    "2": "CAF",
    "3": "T cell",
    "4": "Endothelial"
  };

  function submitAnswer() {
    const cellId = document.getElementById("cell-id").value;
    const predicted = document.getElementById("cell-type").value;
    const feedback = document.getElementById("feedback");

    if (!cellId || !predicted) {
      alert("Please select both Cell ID and Cell Type.");
      return;
    }

    const correct = groundTruth[cellId];

    feedback.style.display = "block";

    if (predicted === correct) {
      feedback.className = "feedback correct";
      feedback.innerHTML = `✅ Correct!<br>Cell ${cellId} is <strong>${correct}</strong>.`;
    } else {
      feedback.className = "feedback wrong";
      feedback.innerHTML = `❌ Incorrect.<br>Your answer: <strong>${predicted}</strong><br>
                            Correct answer: <strong>${correct}</strong>.`;
    }
  }
</script>

<!-- ✅ Member UI wiring + sign-out -->
<script type="module">
  // If the auth guard succeeded, it set these globals.
  const email = window.__memberEmail || "";
  const supabase = window.__supabaseClient;

  const box = document.getElementById("memberBox");
  const emailEl = document.getElementById("memberEmail");
  const signOutBtn = document.getElementById("signOutBtn");

  if (email || supabase) {
    box.style.display = "flex";
    emailEl.textContent = email ? email : "Member";
  }

  signOutBtn?.addEventListener("click", async () => {
    if (!supabase) {
      window.location.href = "/login.html?next=" + encodeURIComponent(window.location.pathname || "/challenge.html");
      return;
    }
    try {
      await supabase.auth.signOut();
    } catch (e) {
      // even if signOut fails, we force user to re-auth
    }
    window.location.href = "/login.html?signed_out=1";
  });
</script>

</body>
</html>
