<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Article | Open Submissions | RNA-Pathology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Write and publish a new article." />
  <link rel="stylesheet" href="/assets/site.css" />

  <!-- Quill (rich text editor) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
  <!-- DOMPurify (sanitize HTML) -->
  <script src="https://unpkg.com/dompurify@3.3.1/dist/purify.min.js"></script>

  <script defer src="/assets/site.js"></script>
  <script defer src="/assets/open_new.js"></script>
</head>
<body>
  <main class="container">
    <a href="/open/">← Back</a>
    <h1>New Article</h1>

    <form id="articleForm" class="stack">
      <label>
        <div class="label">Title</div>
        <input id="articleTitleInput" type="text" maxlength="200" required placeholder="Enter a clear, specific title" />
      </label>

      <div>
        <div class="label">Content</div>
        <div id="editorToolbar">
  <span class="ql-formats">
    <select class="ql-header">
      <option selected></option>
      <option value="1"></option>
      <option value="2"></option>
      <option value="3"></option>
    </select>
    <select class="ql-size">
      <option value="small"></option>
      <option selected></option>
      <option value="large"></option>
      <option value="huge"></option>
    </select>
  </span>

  <span class="ql-formats">
    <button class="ql-bold"></button>
    <button class="ql-italic"></button>
    <button class="ql-underline"></button>
    <button class="ql-strike"></button>
  </span>

  <span class="ql-formats">
    <select class="ql-color"></select>
    <select class="ql-background"></select>
  </span>

  <span class="ql-formats">
    <button class="ql-list" value="ordered"></button>
    <button class="ql-list" value="bullet"></button>
    <button class="ql-blockquote"></button>
    <button class="ql-code-block"></button>
  </span>

  <span class="ql-formats">
    <button class="ql-link"></button>
    <button class="ql-image"></button>
  </span>

  <span class="ql-formats">
    <button class="ql-clean"></button>
  </span>
</div>
        <div id="editor" style="height: 340px;"></div>
        <div class="muted" style="margin-top:8px;">
          Tip: paste from Word is fine; we sanitize before saving.
        </div>
      </div>

      <button type="submit" class="btn">Publish</button>
      <div id="formMsg" class="muted"></div>
    </form>
  </main>
</body>
</html>
