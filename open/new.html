<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Article | Open Submissions | RNA-Pathology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Write and publish a new article." />
  <link rel="stylesheet" href="/assets/site.css" />

  <!-- Quill (rich text editor) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
  <!-- DOMPurify (sanitize HTML) -->
  <script src="https://unpkg.com/dompurify@3.3.1/dist/purify.min.js"></script>

  <script defer src="/assets/site.js"></script>
  <script defer src="/assets/open_new.js"></script>
</head>
<body>
  <main class="container">
    <a href="/open/">← Back</a>
    <h1>New Article</h1>

    <form id="articleForm" class="stack">
      <label>
        <div class="label">Title</div>
        <input id="articleTitleInput" type="text" maxlength="200" required placeholder="Enter a clear, specific title" />
      </label>

      <div>
        <div class="label">Content</div>
        <div id="editorToolbar"></div>
        <div id="editor" style="height: 340px;"></div>
        <div class="muted" style="margin-top:8px;">
          Tip: paste from Word is fine; we sanitize before saving.
        </div>
      </div>

      <button type="submit" class="btn">Publish</button>
      <div id="formMsg" class="muted"></div>
    </form>
  </main>
</body>
</html>
