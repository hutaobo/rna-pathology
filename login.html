<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RNA-pathology — Sign In / Sign Up</title>

  <style>
    :root{
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0b3c5d;
      --primary2: #0a3552;
      --link-muted: #bcd3e6;
      --danger: #b91c1c;
      --success: #047857;
      --warn: #b45309;
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% -10%, #e8f1f8 0%, rgba(232,241,248,0) 60%),
        radial-gradient(1000px 500px at 90% 10%, #eef2ff 0%, rgba(238,242,255,0) 55%),
        var(--bg);
      line-height: 1.6;
      padding: 56px 18px;
    }

    .wrap{ max-width: 720px; margin: 0 auto; }

    .hero{
      background: linear-gradient(180deg, rgba(11,60,93,1) 0%, rgba(10,53,82,1) 100%);
      color: #fff;
      border-radius: 18px;
      padding: 26px 26px 22px;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:-80px -120px auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0));
      transform: rotate(15deg);
      pointer-events:none;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .brand h1{
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .tm{ font-size: 0.7em; vertical-align: super; opacity: 0.9; }

    .home-link{
      color: var(--link-muted);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(188,211,230,0.25);
      padding-bottom: 1px;
      white-space: nowrap;
    }

    .home-link:hover{
      color: #ffffff;
      border-bottom-color: rgba(255,255,255,0.5);
    }

    .tagline{
      margin: 12px 0 0;
      color: #dbe7f0;
      font-size: 14px;
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .title{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }

    .title h2{ margin: 0; font-size: 20px; letter-spacing: -0.2px; }

    .hint{ color: var(--muted); font-size: 13px; margin: 0; }

    .field{ margin-top: 12px; }

    label{
      display:block;
      font-size: 13px;
      font-weight: 700;
      color: #1f2933;
      margin-bottom: 6px;
    }

    input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 16px;
      outline: none;
      transition: box-shadow 0.12s ease, border-color 0.12s ease;
    }

    input:focus{
      border-color: rgba(11,60,93,0.55);
      box-shadow: 0 0 0 4px rgba(11,60,93,0.10);
    }

    .row{
      display:flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #0b3c5d;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      flex: 1 1 220px;
      min-height: 46px;
    }

    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(2, 6, 23, 0.10);
    }

    .btn.secondary{
      background: rgba(11,60,93,0.06);
      color: #0b3c5d;
      border-color: rgba(11,60,93,0.12);
    }

    .btn.secondary:hover{ background: rgba(11,60,93,0.09); }

    .btn.danger{
      background: rgba(185,28,28,0.06);
      color: #7f1d1d;
      border-color: rgba(185,28,28,0.12);
    }

    .btn.danger:hover{ background: rgba(185,28,28,0.09); }

    .btn.is-active{
      border-color: rgba(255,255,255,0.0);
      background: linear-gradient(180deg, rgba(11,60,93,1) 0%, rgba(10,53,82,1) 100%);
      color: #ffffff;
      box-shadow: 0 12px 26px rgba(2, 6, 23, 0.18);
    }

    .btn:disabled{
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .linkbtn{
      border: 0;
      background: transparent;
      padding: 0;
      margin-top: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #0b3c5d;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px solid rgba(11,60,93,0.25);
      padding-bottom: 1px;
      display: inline-block;
    }
    .linkbtn:hover{ border-bottom-color: rgba(11,60,93,0.5); }

    .status{
      margin-top: 14px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fafafa;
      color: #111827;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .status.ok{ border-color: rgba(4,120,87,0.25); background: rgba(4,120,87,0.06); }
    .status.warn{ border-color: rgba(180,83,9,0.25); background: rgba(180,83,9,0.06); }
    .status.err{ border-color: rgba(185,28,28,0.25); background: rgba(185,28,28,0.06); }

    .fineprint{
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .fineprint a{
      color: #0b3c5d;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(11,60,93,0.25);
      padding-bottom: 1px;
    }

    .fineprint a:hover{ border-bottom-color: rgba(11,60,93,0.5); }

    @media (max-width: 560px){
      body{ padding: 40px 16px; }
      .hero{ padding: 22px 18px; }
      .btn{ flex: 1 1 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="topbar">
        <div class="brand">
          <h1>RNA-Pathology<span class="tm">™</span></h1>
        </div>
        <a class="home-link" href="/">Back to Home</a>
      </div>
      <p class="tagline">
        Sign in to access member features. New here? Create an account in under a minute.
      </p>
    </div>

    <div class="card">
      <div class="title">
        <h2>Sign In / Sign Up</h2>
        <p class="hint" id="modeHint">Ready.</p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@domain.com" autocomplete="email" />
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
      </div>

      <div class="row" id="authButtonsRow">
        <button class="btn secondary" id="signup" type="button">Sign Up</button>
        <button class="btn" id="signin" type="button">Sign In</button>
      </div>

      <div style="margin-top:8px;" id="forgotRow">
        <button class="linkbtn" id="forgot" type="button">Forgot password?</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn danger" id="signout" type="button" style="display:none;">Sign Out</button>
      </div>

      <div id="msg" class="status">Loading…</div>

      <div class="fineprint">
        By signing in, you agree to the project’s <a href="/access/">Legal / Usage</a> terms.
      </div>
    </div>
  </div>

  <script type="module">
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const $ = (id) => document.getElementById(id);

    const statusEl = $("msg");
    const modeHintEl = $("modeHint");
    const btnSignUp = $("signup");
    const btnSignIn = $("signin");
    const btnSignOut = $("signout");
    const btnForgot = $("forgot");

    const authButtonsRow = $("authButtonsRow");
    const forgotRow = $("forgotRow");
    const passwordField = $("passwordField");

    let btnUpdatePassword = null;
    let inRecovery = false;

    // Absolute URL builder for Supabase redirectTo/emailRedirectTo (must be absolute)
    function appUrl(path = "/login.html") {
      return new URL(path, location.origin).toString();
    }

    function setStatus(text, level = "info") {
      statusEl.className = "status";
      if (level === "ok") statusEl.classList.add("ok");
      if (level === "warn") statusEl.classList.add("warn");
      if (level === "err") statusEl.classList.add("err");
      statusEl.textContent = text;
    }

    function setMode(mode) {
      btnSignUp.classList.toggle("is-active", mode === "signup");
      btnSignIn.classList.toggle("is-active", mode === "signin");
      if (mode === "signup") modeHintEl.textContent = "Tip: Click “Sign Up” to create a new account.";
      if (mode === "signin") modeHintEl.textContent = "Tip: Click “Sign In” to use an existing account.";
    }

    function getQueryFlag(name) {
      return new URL(window.location.href).searchParams.get(name);
    }

    function parseParamsFromHash() {
      const h = window.location.hash?.startsWith("#") ? window.location.hash.slice(1) : "";
      return new URLSearchParams(h);
    }

    function isRecoveryIntentFromUrl() {
      const u = new URL(window.location.href);
      const qType = u.searchParams.get("type");
      const hType = parseParamsFromHash().get("type");
      return (qType === "recovery" || hType === "recovery");
    }

    // Only allow same-origin next, and avoid redirecting back to login itself
    function getSafeNextPath() {
      const u = new URL(window.location.href);
      const raw = u.searchParams.get("next");
      if (!raw) return null;

      try {
        const dest = new URL(raw, location.origin); // resolves relative paths against same origin
        if (dest.origin !== location.origin) return null;

        if (dest.pathname === "/login.html") return null; // prevent loops

        return dest.pathname + dest.search + dest.hash;
      } catch (_) {
        return null;
      }
    }

    function buildLoginReturnUrl(extraParams = {}) {
      const u = new URL("/login.html", location.origin);
      const next = getSafeNextPath();
      if (next) u.searchParams.set("next", next);

      for (const [k, v] of Object.entries(extraParams)) {
        if (v === undefined || v === null) continue;
        u.searchParams.set(k, String(v));
      }
      return u.toString();
    }

    function redirectTo(path, { replace = true } = {}) {
      if (replace) {
        // replace avoids back-button loops :contentReference[oaicite:4]{index=4}
        window.location.replace(path);
      } else {
        window.location.href = path;
      }
    }

    function disableAuthButtons(disabled) {
      btnSignUp.disabled = disabled;
      btnSignIn.disabled = disabled;
      btnSignOut.disabled = disabled;
      btnForgot.disabled = disabled;
      if (btnUpdatePassword) btnUpdatePassword.disabled = disabled;
    }

    // ---- Initial mode & status ----
    const signupFlag = getQueryFlag("signup");
    const signedOutFlag = getQueryFlag("signed_out");
    const passwordResetFlag = getQueryFlag("password_reset");

    if (passwordResetFlag === "1" || passwordResetFlag === "true") {
      setMode("signin");
      setStatus("Password updated. Please sign in with your new password.", "ok");
    } else if (signedOutFlag === "1" || signedOutFlag === "true") {
      setMode("signin");
      setStatus("Signed out. You can sign in again.", "ok");
    } else if (signupFlag === "1" || signupFlag === "true") {
      setMode("signup");
      setStatus("Ready to sign up. Enter your email + password, then click “Sign Up”.", "warn");
      setTimeout(() => $("password").focus(), 50);
    } else {
      setMode("signin");
      setStatus("Ready to sign in. Enter your email + password, then click “Sign In”.");
    }

    try {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      async function refreshUI() {
        try {
          // getUser() is network-validated and authentic :contentReference[oaicite:5]{index=5}
          const { data, error } = await supabase.auth.getUser();

          // If there's simply no session, treat as signed out (don't show as an error)
          const missing =
            error &&
            (error.name === "AuthSessionMissingError" ||
             /auth session missing/i.test(error.message || ""));

          if (missing) {
            btnSignOut.style.display = "none";
            return;
          }
          if (error) throw error;

          const user = data?.user;
          if (user) {
            btnSignOut.style.display = "inline-flex";
            setStatus(
              "Signed in as: " + (user.email || "(no email)") + "\nuser_id: " + user.id,
              "ok"
            );
          } else {
            btnSignOut.style.display = "none";
          }
        } catch (e) {
          btnSignOut.style.display = "none";
          setStatus("Session check failed:\n" + (e?.message || String(e)), "err");
        }
      }

      // ---- If we land here with ?code=..., exchange it for a session (PKCE) ----
      // exchangeCodeForSession is used in PKCE flows :contentReference[oaicite:6]{index=6}
      try {
        const u = new URL(window.location.href);
        const code = u.searchParams.get("code");
        if (code) {
          // Avoid exchanging twice if a session already exists
          const { data: sessData } = await supabase.auth.getSession();
          if (!sessData?.session) {
            const { error } = await supabase.auth.exchangeCodeForSession(code);
            if (error) {
              setStatus("Auth code exchange warning:\n" + (error?.message || String(error)), "warn");
            }
          }

          // Clean URL (remove ?code=...)
          u.searchParams.delete("code");
          window.history.replaceState({}, document.title, u.toString());
        }
      } catch (_) {}

      // ---- Recovery UI (Step 2 of password reset) ----
      function ensureRecoveryUI() {
        if (inRecovery) return;
        inRecovery = true;

        setMode("signin");
        modeHintEl.textContent = "Password recovery mode.";
        setStatus("Password recovery detected. Please set a new password below.", "warn");

        authButtonsRow.style.display = "none";
        forgotRow.style.display = "none";
        btnSignOut.style.display = "none";

        const pw = $("password");
        pw.value = "";
        pw.placeholder = "New password (at least 6 characters)";
        pw.autocomplete = "new-password";

        if (!$("password2")) {
          const lab2 = document.createElement("label");
          lab2.setAttribute("for", "password2");
          lab2.textContent = "Confirm new password";

          const pw2 = document.createElement("input");
          pw2.id = "password2";
          pw2.type = "password";
          pw2.placeholder = "Repeat new password";
          pw2.autocomplete = "new-password";
          pw2.style.marginTop = "10px";

          passwordField.appendChild(lab2);
          passwordField.appendChild(pw2);

          const row = document.createElement("div");
          row.className = "row";
          row.style.marginTop = "12px";

          const btn = document.createElement("button");
          btn.className = "btn is-active";
          btn.type = "button";
          btn.id = "updatePassword";
          btn.textContent = "Update Password";

          row.appendChild(btn);
          statusEl.parentElement.insertBefore(row, statusEl);

          btnUpdatePassword = btn;

          btn.addEventListener("click", async () => {
            const newPass = pw.value;
            const newPass2 = pw2.value;

            if (!newPass || newPass.length < 6) return setStatus("New password must be at least 6 characters.", "warn");
            if (newPass !== newPass2) return setStatus("Passwords do not match.", "warn");

            disableAuthButtons(true);
            setStatus("Updating password…", "warn");

            try {
              const { error } = await supabase.auth.updateUser({ password: newPass });
              if (error) throw error;

              // Optional but helps avoid weird states: sign out after password change
              try { await supabase.auth.signOut(); } catch (_) {}

              setStatus("Password updated successfully. Please sign in with your new password.", "ok");
              redirectTo("/login.html?password_reset=1", { replace: true });
            } catch (e) {
              setStatus("Password update failed:\n" + (e?.message || String(e)), "err");
            } finally {
              disableAuthButtons(false);
            }
          });
        }
      }

      if (isRecoveryIntentFromUrl()) {
        ensureRecoveryUI();
      }

      // Listen to auth events :contentReference[oaicite:7]{index=7}
      supabase.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          ensureRecoveryUI();
          return;
        }
        refreshUI();
      });

      // If already signed in and there is an explicit safe `next`, go there (but not in recovery flow)
      try {
        const recoveryIntent = isRecoveryIntentFromUrl();
        const next = getSafeNextPath();
        const { data: { session } } = await supabase.auth.getSession();

        if (session && next && !recoveryIntent && !inRecovery) {
          redirectTo(next, { replace: true });
          return;
        }
      } catch (_) {}

      btnSignUp.addEventListener("click", async () => {
        if (inRecovery) return;

        setMode("signup");
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!email) return setStatus("Please enter an email.", "warn");
        if (!password || password.length < 6) return setStatus("Password must be at least 6 characters.", "warn");

        disableAuthButtons(true);
        setStatus("Signing up…", "warn");

        try {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              // Keep user on same origin; include `next` if present
              emailRedirectTo: buildLoginReturnUrl()
            }
          });
          if (error) throw error;

          setStatus(
            "Sign up request sent.\n\nIf email confirmation is enabled, please check your inbox and click the confirmation link.\n" +
            (data.user?.email ?? ""),
            "ok"
          );
          await refreshUI();
        } catch (e) {
          setStatus("Sign up failed:\n" + (e?.message || String(e)), "err");
        } finally {
          disableAuthButtons(false);
        }
      });

      btnSignIn.addEventListener("click", async () => {
        if (inRecovery) return;

        setMode("signin");
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!email) return setStatus("Please enter an email.", "warn");
        if (!password) return setStatus("Please enter a password.", "warn");

        disableAuthButtons(true);
        setStatus("Signing in…", "warn");

        try {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const next = getSafeNextPath();
          redirectTo(next || "/?signed_in=1", { replace: true });
        } catch (e) {
          setStatus("Sign in failed:\n" + (e?.message || String(e)), "err");
        } finally {
          disableAuthButtons(false);
        }
      });

      // Forgot password: sends email; actual reset happens after return + updateUser :contentReference[oaicite:8]{index=8}
      btnForgot.addEventListener("click", async () => {
        if (inRecovery) return;

        const email = $("email").value.trim();
        if (!email) return setStatus("Please enter your email first, then click “Forgot password?”.", "warn");

        disableAuthButtons(true);
        setStatus("Sending reset email…", "warn");

        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: buildLoginReturnUrl()
          });
          if (error) throw error;

          setStatus(
            "Reset email sent.\n\nPlease check your inbox and follow the link to set a new password.",
            "ok"
          );
        } catch (e) {
          setStatus("Reset failed:\n" + (e?.message || String(e)), "err");
        } finally {
          disableAuthButtons(false);
        }
      });

      btnSignOut.addEventListener("click", async () => {
        disableAuthButtons(true);
        setStatus("Signing out…", "warn");

        try {
          const { error } = await supabase.auth.signOut();
          if (error) throw error;

          setStatus("Signed out.", "ok");
          redirectTo("/login.html?signed_out=1", { replace: true });
        } catch (e) {
          setStatus("Sign out failed:\n" + (e?.message || String(e)), "err");
        } finally {
          disableAuthButtons(false);
        }
      });

      await refreshUI();

    } catch (e) {
      setStatus("Startup error:\n" + (e?.stack || e?.message || String(e)), "err");
    }
  </script>
</body>
</html>
