<!doctype html>
<html lang="en" data-base-path="/rna-pathology">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RNA-pathology — Sign In / Sign Up</title>

  <style>
    :root{
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0b3c5d;
      --primary2: #0a3552;
      --link-muted: #bcd3e6;
      --danger: #b91c1c;
      --success: #047857;
      --warn: #b45309;
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% -10%, #e8f1f8 0%, rgba(232,241,248,0) 60%),
        radial-gradient(1000px 500px at 90% 10%, #eef2ff 0%, rgba(238,242,255,0) 55%),
        var(--bg);
      line-height: 1.6;
      padding: 56px 18px;
    }

    .wrap{ max-width: 720px; margin: 0 auto; }

    .hero{
      background: linear-gradient(180deg, rgba(11,60,93,1) 0%, rgba(10,53,82,1) 100%);
      color: #fff;
      border-radius: 18px;
      padding: 26px 26px 22px;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:-80px -120px auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0));
      transform: rotate(15deg);
      pointer-events:none;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .brand h1{
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .tm{ font-size: 0.7em; vertical-align: super; opacity: 0.9; }

    .home-link{
      color: var(--link-muted);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(188,211,230,0.25);
      padding-bottom: 1px;
      white-space: nowrap;
    }

    .home-link:hover{
      color: #ffffff;
      border-bottom-color: rgba(255,255,255,0.5);
    }

    .tagline{
      margin: 12px 0 0;
      color: #dbe7f0;
      font-size: 14px;
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .title{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }

    .title h2{ margin: 0; font-size: 20px; letter-spacing: -0.2px; }

    .hint{ color: var(--muted); font-size: 13px; margin: 0; }

    .field{ margin-top: 12px; }

    label{
      display:block;
      font-size: 13px;
      font-weight: 700;
      color: #1f2933;
      margin-bottom: 6px;
    }

    input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 16px;
      outline: none;
      transition: box-shadow 0.12s ease, border-color 0.12s ease;
    }

    input:focus{
      border-color: rgba(11,60,93,0.55);
      box-shadow: 0 0 0 4px rgba(11,60,93,0.10);
    }

    .row{
      display:flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #0b3c5d;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      flex: 1 1 220px;
      min-height: 46px;
    }

    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(2, 6, 23, 0.10);
    }

    .btn.secondary{
      background: rgba(11,60,93,0.06);
      color: #0b3c5d;
      border-color: rgba(11,60,93,0.12);
    }

    .btn.secondary:hover{ background: rgba(11,60,93,0.09); }

    .btn.danger{
      background: rgba(185,28,28,0.06);
      color: #7f1d1d;
      border-color: rgba(185,28,28,0.12);
    }

    .btn.danger:hover{ background: rgba(185,28,28,0.09); }

    .btn.is-active{
      border-color: rgba(255,255,255,0.0);
      background: linear-gradient(180deg, rgba(11,60,93,1) 0%, rgba(10,53,82,1) 100%);
      color: #ffffff;
      box-shadow: 0 12px 26px rgba(2, 6, 23, 0.18);
    }

    .btn:disabled{
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .linkbtn{
      border: 0;
      background: transparent;
      padding: 0;
      margin-top: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #0b3c5d;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px solid rgba(11,60,93,0.25);
      padding-bottom: 1px;
      display: inline-block;
    }
    .linkbtn:hover{ border-bottom-color: rgba(11,60,93,0.5); }

    .status{
      margin-top: 14px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fafafa;
      color: #111827;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .status.ok{ border-color: rgba(4,120,87,0.25); background: rgba(4,120,87,0.06); }
    .status.warn{ border-color: rgba(180,83,9,0.25); background: rgba(180,83,9,0.06); }
    .status.err{ border-color: rgba(185,28,28,0.25); background: rgba(185,28,28,0.06); }

    .fineprint{
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .fineprint a{
      color: #0b3c5d;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(11,60,93,0.25);
      padding-bottom: 1px;
    }

    .fineprint a:hover{ border-bottom-color: rgba(11,60,93,0.5); }

    @media (max-width: 560px){
      body{ padding: 40px 16px; }
      .hero{ padding: 22px 18px; }
      .btn{ flex: 1 1 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="topbar">
        <div class="brand">
          <h1>RNA-Pathology<span class="tm">™</span></h1>
        </div>

        <!-- ✅ 改：给一个 id，脚本里会自动算出正确的 Home（兼容 /login 和 GitHub Pages 子目录） -->
        <a class="home-link" id="homeLink" href="/">Back to Home</a>
      </div>
      <p class="tagline">
        Sign in to access member features. New here? Create an account in under a minute.
      </p>
    </div>

    <div class="card">
      <div class="title">
        <h2>Sign In / Sign Up</h2>
        <p class="hint" id="modeHint">Ready.</p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@domain.com" autocomplete="email" />
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
      </div>

      <div class="row" id="authButtonsRow">
        <button class="btn secondary" id="signup" type="button">Sign Up</button>
        <button class="btn" id="signin" type="button">Sign In</button>
      </div>

      <div style="margin-top:8px;" id="forgotRow">
        <button class="linkbtn" id="forgot" type="button">Forgot password?</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn danger" id="signout" type="button" style="display:none;">Sign Out</button>
      </div>

      <div id="msg" class="status">Loading…</div>

      <div class="fineprint">
        By signing in, you agree to the project’s
        <!-- ✅ 改：同样给 id，脚本里拼出正确的 /access/ -->
        <a id="legalLink" href="/access/">Legal / Usage</a>
        terms.
      </div>
    </div>
  </div>

  <script type="module">
    // =============================
    // Supabase config
    // =============================
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const $ = (id) => document.getElementById(id);

    // =============================
    // Path / base-path helpers
    //   - supports custom domain root: https://www.rna-pathology.com/...
    //   - supports GitHub Pages subdir: https://xxx.github.io/rna-pathology/...
    // =============================
    function normalizePath(p) {
      const s = (p || "/").trim();
      const noTrail = s.replace(/\/+$/g, "");
      return noTrail || "/";
    }

    function detectBasePath() {
      // If html[data-base-path] exists AND current pathname starts with it, we use it.
      // Otherwise we ignore it (prevents wrong base-path on custom domain).
      const raw = (document.documentElement.dataset.basePath || "").trim();
      if (!raw) return "";
      const bp = "/" + raw.replace(/^\/+|\/+$/g, "");
      if (bp === "/") return "";
      const pn = location.pathname || "/";
      if (pn === bp || pn.startsWith(bp + "/")) return bp;
      return "";
    }

    const BASE_PATH = detectBasePath();              // "" or "/rna-pathology"
    const LOGIN_PATH = location.pathname || "/";     // current path: /login OR /login.html OR /rna-pathology/login.html ...
    const LOGIN_PATH_NORM = normalizePath(LOGIN_PATH);

    function homePath() {
      return (BASE_PATH || "") + "/";
    }
    function accessPath() {
      return (BASE_PATH || "") + "/access/";
    }

    // Fix top links so they work even when this page is /login/ (directory URL)
    const homeLink = $("homeLink");
    if (homeLink) homeLink.href = homePath();
    const legalLink = $("legalLink");
    if (legalLink) legalLink.href = accessPath();

    // =============================
    // DOM refs
    // =============================
    const statusEl = $("msg");
    const modeHintEl = $("modeHint");
    const btnSignUp = $("signup");
    const btnSignIn = $("signin");
    const btnSignOut = $("signout");
    const btnForgot = $("forgot");

    const authButtonsRow = $("authButtonsRow");
    const forgotRow = $("forgotRow");
    const passwordField = $("passwordField");

    let btnUpdatePassword = null;
    let inRecovery = false;

    // Supabase runtime vars (so click handlers always exist)
    let supabase = null;
    let startupError = null;
    let sdkLoadedFrom = null;

    // =============================
    // UI helpers
    // =============================
    function setStatus(text, level = "info") {
      statusEl.className = "status";
      if (level === "ok") statusEl.classList.add("ok");
      if (level === "warn") statusEl.classList.add("warn");
      if (level === "err") statusEl.classList.add("err");
      statusEl.textContent = text;
    }

    function setMode(mode) {
      btnSignUp.classList.toggle("is-active", mode === "signup");
      btnSignIn.classList.toggle("is-active", mode === "signin");
      if (mode === "signup") modeHintEl.textContent = "Tip: Click “Sign Up” to create a new account.";
      if (mode === "signin") modeHintEl.textContent = "Tip: Click “Sign In” to use an existing account.";
    }

    function disableAuthButtons(disabled) {
      btnSignUp.disabled = disabled;
      btnSignIn.disabled = disabled;
      btnSignOut.disabled = disabled;
      btnForgot.disabled = disabled;
      if (btnUpdatePassword) btnUpdatePassword.disabled = disabled;
    }

    function authReadyOrExplain() {
      if (supabase) return true;

      if (startupError) {
        setStatus(
          "Auth startup error (SDK failed to load):\n" +
          (startupError?.stack || startupError?.message || String(startupError)),
          "err"
        );
      } else {
        setStatus(
          "Authentication system is still loading.\n\n" +
          "If this does not finish, it usually means the browser cannot load the Supabase SDK CDN scripts.\n" +
          "Try a different network / disable aggressive blockers / check Console for errors.",
          "warn"
        );
      }
      return false;
    }

    // Make sure we never end up with “dead click”
    window.addEventListener("error", (evt) => {
      try {
        const msg = evt?.error?.stack || evt?.message || "Unknown script error";
        console.error(evt);
        setStatus("JavaScript error:\n" + msg, "err");
      } catch (_) {}
    });
    window.addEventListener("unhandledrejection", (evt) => {
      try {
        const r = evt?.reason;
        const msg = r?.stack || r?.message || String(r || "Unknown rejection");
        console.error(evt);
        setStatus("Unhandled promise rejection:\n" + msg, "err");
      } catch (_) {}
    });

    // =============================
    // URL helpers
    // =============================
    function getQueryFlag(name) {
      return new URL(window.location.href).searchParams.get(name);
    }

    function parseParamsFromHash() {
      const h = window.location.hash?.startsWith("#") ? window.location.hash.slice(1) : "";
      return new URLSearchParams(h);
    }

    function isRecoveryIntentFromUrl() {
      const u = new URL(window.location.href);
      const qType = u.searchParams.get("type");
      const hType = parseParamsFromHash().get("type");
      return (qType === "recovery" || hType === "recovery");
    }

    // Only allow same-origin next. If BASE_PATH is used (GitHub Pages subdir),
    // keep redirects within that base-path to avoid 404s.
    function getSafeNextPath() {
      const u = new URL(window.location.href);
      const raw = u.searchParams.get("next");
      if (!raw) return null;

      try {
        const baseForRelative = new URL((BASE_PATH || "") + "/", location.origin);
        const dest = new URL(raw, baseForRelative);

        if (dest.origin !== location.origin) return null;

        if (BASE_PATH) {
          const pn = dest.pathname;
          if (!(pn === BASE_PATH || pn.startsWith(BASE_PATH + "/"))) return null;
        }

        // Avoid redirect loop back to login itself
        if (normalizePath(dest.pathname) === LOGIN_PATH_NORM) return null;

        return dest.pathname + dest.search + dest.hash;
      } catch (_) {
        return null;
      }
    }

    function buildLoginReturnUrl(extraParams = {}) {
      // Use the current path as the login callback path, so it works for:
      // - /login
      // - /login.html
      // - /rna-pathology/login.html
      const u = new URL(location.origin + (LOGIN_PATH || "/"));

      const next = getSafeNextPath();
      if (next) u.searchParams.set("next", next);

      for (const [k, v] of Object.entries(extraParams)) {
        if (v === undefined || v === null) continue;
        u.searchParams.set(k, String(v));
      }

      return u.toString();
    }

    function redirectTo(target, { replace = true } = {}) {
      // target is expected to be a path like "/xxx" or an absolute URL
      let url = target;
      try {
        url = new URL(target, location.origin).toString();
      } catch (_) {}
      if (replace) window.location.replace(url);
      else window.location.href = url;
    }

    // =============================
    // Initial mode + message (same behavior as your original)
    // =============================
    const signupFlag = getQueryFlag("signup");
    const signedOutFlag = getQueryFlag("signed_out");
    const passwordResetFlag = getQueryFlag("password_reset");

    if (passwordResetFlag === "1" || passwordResetFlag === "true") {
      setMode("signin");
      setStatus("Password updated. Please sign in with your new password.", "ok");
    } else if (signedOutFlag === "1" || signedOutFlag === "true") {
      setMode("signin");
      setStatus("Signed out. You can sign in again.", "ok");
    } else if (signupFlag === "1" || signupFlag === "true") {
      setMode("signup");
      setStatus("Ready to sign up. Enter your email + password, then click “Sign Up”.", "warn");
      setTimeout(() => $("password").focus(), 50);
    } else {
      setMode("signin");
      setStatus("Ready to sign in. Enter your email + password, then click “Sign In”.");
    }

    // Enter key convenience (optional but helps UX)
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const el = document.activeElement;
      if (!el) return;
      const tag = (el.tagName || "").toLowerCase();
      if (tag !== "input") return;

      e.preventDefault();

      if (inRecovery && btnUpdatePassword) {
        btnUpdatePassword.click();
        return;
      }
      if (btnSignUp.classList.contains("is-active")) btnSignUp.click();
      else btnSignIn.click();
    });

    // =============================
    // Robust Supabase SDK loader:
    //   - Prefer ESM CDNs (esm.sh, skypack, jspm)
    //   - Fallback to UMD script (unpkg/jsdelivr) -> globalThis.supabase.createClient
    // =============================
    const _loadedScripts = new Map();
    function loadScript(src) {
      if (_loadedScripts.has(src)) return _loadedScripts.get(src);

      const p = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.crossOrigin = "anonymous";
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Failed to load script: " + src));
        document.head.appendChild(s);
      });

      _loadedScripts.set(src, p);
      return p;
    }

    async function loadSupabaseCreateClient() {
      const errors = [];

      // ESM (recommended)
      const esmCandidates = [
        "https://esm.sh/@supabase/supabase-js@2",
        "https://cdn.skypack.dev/@supabase/supabase-js@2",
        "https://jspm.dev/@supabase/supabase-js@2"
      ];

      for (const url of esmCandidates) {
        try {
          const mod = await import(url);
          const createClient = mod?.createClient || mod?.default?.createClient;
          if (typeof createClient !== "function") {
            throw new Error("createClient export not found from: " + url);
          }
          return { createClient, source: url, kind: "esm" };
        } catch (e) {
          errors.push({ url, e });
        }
      }

      // UMD fallback (no bare-import rewrite needed)
      const umdCandidates = [
        "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js",
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
      ];

      for (const url of umdCandidates) {
        try {
          await loadScript(url);
          const createClient = globalThis.supabase?.createClient;
          if (typeof createClient !== "function") {
            throw new Error("globalThis.supabase.createClient not found after loading: " + url);
          }
          return { createClient, source: url, kind: "umd" };
        } catch (e) {
          errors.push({ url, e });
        }
      }

      const detail = errors
        .map(({ url, e }) => `- ${url}\n  ${(e && (e.message || e.toString())) || "unknown error"}`)
        .join("\n");

      throw new Error("Unable to load Supabase JS SDK from any CDN.\n" + detail);
    }

    // =============================
    // Auth logic (mostly your original, but now resilient)
    // =============================
    async function refreshUI() {
      if (!supabase) return;

      try {
        const { data, error } = await supabase.auth.getUser();

        const missing =
          error &&
          (error.name === "AuthSessionMissingError" ||
           /auth session missing/i.test(error.message || ""));

        if (missing) {
          btnSignOut.style.display = "none";
          return;
        }
        if (error) throw error;

        const user = data?.user;
        if (user) {
          btnSignOut.style.display = "inline-flex";
          setStatus(
            "Signed in as: " + (user.email || "(no email)") + "\nuser_id: " + user.id +
            (sdkLoadedFrom ? ("\n\nSDK: " + sdkLoadedFrom) : ""),
            "ok"
          );
        } else {
          btnSignOut.style.display = "none";
        }
      } catch (e) {
        btnSignOut.style.display = "none";
        setStatus("Session check failed:\n" + (e?.message || String(e)), "err");
      }
    }

    function ensureRecoveryUI() {
      if (inRecovery) return;
      inRecovery = true;

      setMode("signin");
      modeHintEl.textContent = "Password recovery mode.";
      setStatus("Password recovery detected. Please set a new password below.", "warn");

      authButtonsRow.style.display = "none";
      forgotRow.style.display = "none";
      btnSignOut.style.display = "none";

      const pw = $("password");
      pw.value = "";
      pw.placeholder = "New password (at least 6 characters)";
      pw.autocomplete = "new-password";

      if (!$("password2")) {
        const lab2 = document.createElement("label");
        lab2.setAttribute("for", "password2");
        lab2.textContent = "Confirm new password";

        const pw2 = document.createElement("input");
        pw2.id = "password2";
        pw2.type = "password";
        pw2.placeholder = "Repeat new password";
        pw2.autocomplete = "new-password";
        pw2.style.marginTop = "10px";

        passwordField.appendChild(lab2);
        passwordField.appendChild(pw2);

        const row = document.createElement("div");
        row.className = "row";
        row.style.marginTop = "12px";

        const btn = document.createElement("button");
        btn.className = "btn is-active";
        btn.type = "button";
        btn.id = "updatePassword";
        btn.textContent = "Update Password";

        row.appendChild(btn);
        statusEl.parentElement.insertBefore(row, statusEl);

        btnUpdatePassword = btn;

        btn.addEventListener("click", async () => {
          if (!authReadyOrExplain()) return;

          const newPass = pw.value;
          const newPass2 = pw2.value;

          if (!newPass || newPass.length < 6) return setStatus("New password must be at least 6 characters.", "warn");
          if (newPass !== newPass2) return setStatus("Passwords do not match.", "warn");

          disableAuthButtons(true);
          setStatus("Updating password…", "warn");

          try {
            const { error } = await supabase.auth.updateUser({ password: newPass });
            if (error) throw error;

            try { await supabase.auth.signOut(); } catch (_) {}

            setStatus("Password updated successfully. Please sign in with your new password.", "ok");
            redirectTo(buildLoginReturnUrl({ password_reset: 1 }), { replace: true });
          } catch (e) {
            setStatus("Password update failed:\n" + (e?.message || String(e)), "err");
          } finally {
            disableAuthButtons(false);
          }
        });
      }
    }

    // =============================
    // Bind button handlers EARLY
    //   so even if SDK fails, user never gets “no response”
    // =============================
    btnSignUp.addEventListener("click", async () => {
      if (inRecovery) return;
      if (!authReadyOrExplain()) return;

      setMode("signup");
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email) return setStatus("Please enter an email.", "warn");
      if (!password || password.length < 6) return setStatus("Password must be at least 6 characters.", "warn");

      disableAuthButtons(true);
      setStatus("Signing up…", "warn");

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: buildLoginReturnUrl() }
        });
        if (error) throw error;

        setStatus(
          "Sign up request sent.\n\nIf email confirmation is enabled, please check your inbox and click the confirmation link.\n" +
          (data.user?.email ?? ""),
          "ok"
        );
        await refreshUI();
      } catch (e) {
        setStatus("Sign up failed:\n" + (e?.message || String(e)), "err");
      } finally {
        disableAuthButtons(false);
      }
    });

    btnSignIn.addEventListener("click", async () => {
      if (inRecovery) return;
      if (!authReadyOrExplain()) return;

      setMode("signin");
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email) return setStatus("Please enter an email.", "warn");
      if (!password) return setStatus("Please enter a password.", "warn");

      disableAuthButtons(true);
      setStatus("Signing in…", "warn");

      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const next = getSafeNextPath();
        redirectTo(next || (homePath() + "?signed_in=1"), { replace: true });
      } catch (e) {
        setStatus("Sign in failed:\n" + (e?.message || String(e)), "err");
      } finally {
        disableAuthButtons(false);
      }
    });

    btnForgot.addEventListener("click", async () => {
      if (inRecovery) return;
      if (!authReadyOrExplain()) return;

      const email = $("email").value.trim();
      if (!email) return setStatus("Please enter your email first, then click “Forgot password?”.", "warn");

      disableAuthButtons(true);
      setStatus("Sending reset email…", "warn");

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: buildLoginReturnUrl()
        });
        if (error) throw error;

        setStatus(
          "Reset email sent.\n\nPlease check your inbox and follow the link to set a new password.",
          "ok"
        );
      } catch (e) {
        setStatus("Reset failed:\n" + (e?.message || String(e)), "err");
      } finally {
        disableAuthButtons(false);
      }
    });

    btnSignOut.addEventListener("click", async () => {
      if (!authReadyOrExplain()) return;

      disableAuthButtons(true);
      setStatus("Signing out…", "warn");

      try {
        const { error } = await supabase.auth.signOut();
        if (error) throw error;

        setStatus("Signed out.", "ok");
        redirectTo(buildLoginReturnUrl({ signed_out: 1 }), { replace: true });
      } catch (e) {
        setStatus("Sign out failed:\n" + (e?.message || String(e)), "err");
      } finally {
        disableAuthButtons(false);
      }
    });

    // =============================
    // Boot: load SDK + init client
    // =============================
    (async () => {
      try {
        const sdk = await loadSupabaseCreateClient();
        sdkLoadedFrom = sdk.source;

        supabase = sdk.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        });

        // If URL has ?code=..., exchange it for a session (PKCE)
        try {
          const u = new URL(window.location.href);
          const code = u.searchParams.get("code");
          if (code) {
            const { data: sessData } = await supabase.auth.getSession();
            if (!sessData?.session) {
              const { error } = await supabase.auth.exchangeCodeForSession(code);
              if (error) {
                setStatus("Auth code exchange warning:\n" + (error?.message || String(error)), "warn");
              }
            }
            u.searchParams.delete("code");
            window.history.replaceState({}, document.title, u.toString());
          }
        } catch (_) {}

        // Recovery mode detection
        if (isRecoveryIntentFromUrl()) ensureRecoveryUI();

        // Auth state listener
        supabase.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") {
            ensureRecoveryUI();
            return;
          }
          refreshUI();
        });

        // If already logged in and has safe next, redirect
        try {
          const recoveryIntent = isRecoveryIntentFromUrl();
          const next = getSafeNextPath();
          const { data: { session } } = await supabase.auth.getSession();
          if (session && next && !recoveryIntent && !inRecovery) {
            redirectTo(next, { replace: true });
            return;
          }
        } catch (_) {}

        await refreshUI();

      } catch (e) {
        startupError = e;
        setStatus("Startup error:\n" + (e?.stack || e?.message || String(e)), "err");
      }
    })();
  </script>
</body>
</html>
