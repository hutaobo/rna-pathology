<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RNA-pathology — Sign In / Sign Up</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:560px;margin:40px auto;padding:0 16px}
    input,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
    .row{display:flex;gap:10px}
    .row button{width:50%}
    #msg{white-space:pre-wrap;color:#333;margin-top:12px}
  </style>
</head>
<body>
  <h1>Sign In / Sign Up</h1>

  <input id="email" type="email" placeholder="Email" autocomplete="email" />
  <input id="password" type="password" placeholder="Password (>= 6 characters)" autocomplete="current-password" />

  <div class="row">
    <button id="signup">Sign Up</button>
    <button id="signin">Sign In</button>
  </div>

  <button id="signout" style="display:none;">Sign Out</button>

  <div id="msg"></div>

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Project settings
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const msg = (t) => { $("msg").textContent = t; };

    async function refreshUI() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        msg("Signed in as: " + session.user.email + "\nuser_id: " + session.user.id);
        $("signout").style.display = "block";
      } else {
        msg("Signed out");
        $("signout").style.display = "none";
      }
    }

    $("signup").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      msg("Signing up…");
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return msg("Sign up failed:\n" + error.message);
      msg("Sign up successful! If email confirmation is enabled, please check your inbox and confirm.\n" + (data.user?.email ?? ""));
      refreshUI();
    };

    $("signin").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      msg("Signing in…");
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return msg("Sign in failed:\n" + error.message);
      msg("Sign in successful: " + data.user.email);
      refreshUI();
    };

    $("signout").onclick = async () => {
      await supabase.auth.signOut();
      msg("Signed out");
      refreshUI();
    };

    // Listen for auth state changes
    supabase.auth.onAuthStateChange((_event, _session) => refreshUI());

    refreshUI();
  </script>
</body>
</html>
