<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RNA-pathology — Sign In / Sign Up</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:560px;margin:40px auto;padding:0 16px}
    input,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
    .row{display:flex;gap:10px}
    .row button{width:50%}
    #msg{white-space:pre-wrap;color:#333;margin-top:12px}
  </style>
</head>
<body>
  <h1>Sign In / Sign Up</h1>

  <input id="email" type="email" placeholder="Email" autocomplete="email" />
  <input id="password" type="password" placeholder="Password (>= 6 characters)" autocomplete="current-password" />

  <div class="row">
    <button id="signup">Sign Up</button>
    <button id="signin">Sign In</button>
  </div>

  <button id="signout" style="display:none;">Sign Out</button>

  <div id="msg"></div>

  <!-- Use ESM to avoid "window.supabase is undefined" + show startup errors in UI -->
  <script type="module">
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const $ = (id) => document.getElementById(id);
    const setMsg = (t) => { $("msg").textContent = t; };

    // Prove JS is running immediately (so “no reaction” becomes impossible)
    setMsg("JavaScript loaded. Initializing Supabase…");

    try {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function refreshUI() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) {
          setMsg("Session check failed:\n" + error.message);
          $("signout").style.display = "none";
          return;
        }
        if (session) {
          setMsg("Signed in as: " + session.user.email + "\nuser_id: " + session.user.id);
          $("signout").style.display = "block";
        } else {
          setMsg("Signed out");
          $("signout").style.display = "none";
        }
      }

      $("signup").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!email) return setMsg("Please enter an email.");
        if (!password || password.length < 6) return setMsg("Password must be at least 6 characters.");

        setMsg("Signing up…");
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: 'https://rna-pathology.com/' }
        });
        if (error) return setMsg("Sign up failed:\n" + error.message);
        setMsg("Sign up successful! If email confirmation is enabled, please check your inbox and confirm.\n" + (data.user?.email ?? ""));
        refreshUI();
      });

      $("signin").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;
        if (!email) return setMsg("Please enter an email.");
        if (!password) return setMsg("Please enter a password.");
        setMsg("Signing in…");
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return setMsg("Sign in failed:\n" + error.message);
        setMsg("Sign in successful: " + data.user.email);
        refreshUI();
      });

      $("signout").addEventListener("click", async () => {
        setMsg("Signing out…");
        const { error } = await supabase.auth.signOut();
        if (error) return setMsg("Sign out failed:\n" + error.message);
        setMsg("Signed out");
        refreshUI();
      });

      supabase.auth.onAuthStateChange(() => refreshUI());
      refreshUI();
    } catch (e) {
      setMsg("Startup error (JS ran, but initialization failed):\n" + (e?.stack || e?.message || String(e)));
    }
  </script>
</body>
</html>
