<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RNA-pathology 登录/注册</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:560px;margin:40px auto;padding:0 16px}
    input,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
    .row{display:flex;gap:10px}
    .row button{width:50%}
    #msg{white-space:pre-wrap;color:#333;margin-top:12px}
  </style>
</head>
<body>
  <h1>登录 / 注册</h1>

  <input id="email" type="email" placeholder="邮箱" autocomplete="email" />
  <input id="password" type="password" placeholder="密码（>= 6 位）" autocomplete="current-password" />

  <div class="row">
    <button id="signup">注册</button>
    <button id="signin">登录</button>
  </div>

  <button id="signout" style="display:none;">退出登录</button>

  <div id="msg"></div>

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 1) 替换成你自己的
    const SUPABASE_URL = "https://xxlkxorwprtynemmbeya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZzCo8J6b6y0xVkExiOtHyg_gOpGEJFv";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const msg = (t) => { $("msg").textContent = t; };

    async function refreshUI() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        msg(`已登录：${session.user.email}\nuser_id: ${session.user.id}`);
        $("signout").style.display = "block";
      } else {
        msg("未登录");
        $("signout").style.display = "none";
      }
    }

    $("signup").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      msg("注册中…");
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return msg("注册失败：\n" + error.message);
      msg("注册成功！如果开启了邮箱验证，请去邮箱点确认链接。\n" + (data.user?.email ?? ""));
      refreshUI();
    };

    $("signin").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      msg("登录中…");
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return msg("登录失败：\n" + error.message);
      msg("登录成功：" + data.user.email);
      refreshUI();
    };

    $("signout").onclick = async () => {
      await supabase.auth.signOut();
      msg("已退出");
      refreshUI();
    };

    // 监听登录态变化（刷新 navbar 很好用）
    supabase.auth.onAuthStateChange((_event, _session) => refreshUI());

    refreshUI();
  </script>
</body>
</html>
